    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const images = document.querySelectorAll(".shot");
            const totalResources = images.length;
            let loadedResources = 0;
            const progressText = document.getElementById("loading-progress");
            const loadingScreen = document.getElementById("loading-screen");

            function updateProgress() {
                loadedResources++;
                const percent = Math.min(100, Math.floor((loadedResources / totalResources) * 100));
                progressText.textContent = percent + "%";
                if (loadedResources >= totalResources) {
                    setTimeout(() => {
                        loadingScreen.style.opacity = "0";
                        setTimeout(() => { loadingScreen.style.display = "none"; }, 400);
                    }, 200);
                }
            }

            images.forEach((img) => {
                if (img.complete && img.naturalWidth !== 0) updateProgress();
                else {
                    img.addEventListener("load", updateProgress);
                    img.addEventListener("error", () => {
                        handleImgFallback(img);
                        updateProgress();
                    });
                }
            });

            setTimeout(() => {
                if (loadingScreen.style.display !== "none") {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => { loadingScreen.style.display = "none"; }, 400);
                }
            }, 3000);
        });

        function handleImgFallback(imgElement) {
            const parent = imgElement.parentElement;
            imgElement.style.display = "none";
            if (parent.querySelector(".fallback-box")) return;
            const box = document.createElement("div");
            box.className = "fallback-box";
            box.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:.6rem;text-align:center;color:#6b4a2a;font-weight:700;";
            box.textContent = imgElement.alt || "圖稿";
            parent.appendChild(box);
        }

                name: "7. 利未記15章—潔淨律法",
                text: "按照律法，患血漏的人在宗教上屬於「不潔淨」。這意味著，凡是摸到她的人，或是她坐過、躺過的地方，都會跟著變得不潔。她無法正常參與聖殿敬拜與任何宗教活動，這十二年來，她只能過著被社會迴避與無情隔離的生活。",
                points: [
                    "患血漏者屬於宗教上的不潔",
                    "摸她的人也不潔",
                    "她坐過、躺過的地方也不潔",
                    "不能正常參與聖殿敬拜及宗教活動",
                    "因此常被迴避與隔離"
                ],
                next: {
                    tag: "物件台詞",
                    name: "潔淨律法書卷",
                    text: "我是利未記第十五章的律法。我的規定非常嚴格：只要婦人患了血漏，她在宗教儀式上就是『不潔淨』的！她躺過的床、坐過的椅子都不潔淨，誰要是碰了她，也會跟著不潔淨。這就是為什麼她不能參加聖殿的敬拜，必須遠離所有的子民，過著孤立無援的生活。"
                }
            },
            8: {
                tag: "恢復",
                name: "8. 耶穌帶來的全面恢復",
                text: "醫治前：身體患病、被視為不潔、與人隔離、無法安心敬拜、沒有盼望。醫治後：身體痊癒、恢復潔淨、回到群體、恢復敬拜生活、得著平安與盼望。",
                points: [
                    "醫治前：身體患病、被視為不潔、與人隔離、無法安心敬拜、沒有盼望",
                    "醫治後：身體痊癒、恢復潔淨、回到群體、恢復敬拜生活、得著平安與盼望"
                ]
            },
            9: {
                tag: "稱呼",
                name: "9. 耶穌稱她「女兒」的意義",
                text: "在第一世紀的社會中，婦女鮮少在公開場合受到稱讚。然而，耶穌卻在眾人面前親口稱呼她為「女兒」。這不僅表達了神完全的接納、尊重與深深的愛，更向所有人宣告：她不再是那個被社會唾棄的「不潔婦人」，而是蒙神珍愛、重獲新生的女兒。",
                points: [
                    "在當時，婦女很少被公開稱讚。",
                    "耶穌稱她「女兒」，表示接納、尊重與愛。",
                    "她不再只是「不潔的婦人」，而是蒙神愛的女兒。"
                ]
            },
            10: {
                tag: "考古",
                name: "10. 考古背景小知識",
                text: "油燈、石製或陶製器皿、麻布衣料、銅幣。",
                points: [
                    "油燈",
                    "石製或陶製器皿",
                    "麻布衣料",
                    "銅幣"
                ]
            }
        };

        let typingInterval = null;
        let currentFullText = "";
        let activeEntry = null;
        let activePage = 0;

        document.querySelectorAll("[data-frame]").forEach((frame) => {
            frame.setAttribute("role", "button");
            frame.setAttribute("tabindex", "0");
            frame.setAttribute("aria-label", frame.getAttribute("title") || "");
            frame.addEventListener("click", () => openFrame(frame.dataset.frame));
            frame.addEventListener("keydown", (e) => {
                if (e.key === "Enter") openFrame(frame.dataset.frame);
            });
        });

        document.getElementById("close-btn").addEventListener("click", closeDialog);
        document.getElementById("skip-btn").addEventListener("click", skipTyping);
        document.getElementById("next-btn").addEventListener("click", () => {
            if (activeEntry && activeEntry.next) {
                activePage = 1;
                renderDialog();
            }
        });
        document.getElementById("prev-btn").addEventListener("click", () => {
            activePage = 0;
            renderDialog();
        });

        function openFrame(id) {
            const data = frameData[id];
            if (!data) return;
            activeEntry = data;
            activePage = 0;
            document.querySelectorAll("[data-frame]").forEach((frame) => {
                frame.classList.toggle("is-selected", frame.dataset.frame === id);
            });
            renderDialog();
        }

        function currentPageData() {
            if (activePage === 1 && activeEntry && activeEntry.next) return activeEntry.next;
            return activeEntry;
        }

        function renderDialog() {
            const page = currentPageData();
            const isSecond = activePage === 1 && activeEntry && activeEntry.next;
            document.getElementById("dialog-tag").textContent = page.tag || "考據細節";
            document.getElementById("dialog-name").textContent = page.name;

            const dialogTextEl = document.getElementById("dialog-text");
            dialogTextEl.textContent = "";
            currentFullText = page.text;

            const extraContainer = document.getElementById("dialog-extra");
            extraContainer.innerHTML = "";
            const points = isSecond ? [] : (activeEntry.points || []);
            points.forEach((pt) => {
                const badge = document.createElement("span");
                badge.style.cssText = "background:rgba(69,26,8,.85);color:#fde68a;border:1px solid rgba(180,120,40,.5);padding:.1rem .45rem;border-radius:.25rem;font-size:.75rem;";
                badge.textContent = "✦ " + pt;
                extraContainer.appendChild(badge);
            });

            const hasNext = !!(activeEntry && activeEntry.next);
            document.getElementById("prev-btn").hidden = !(hasNext && activePage === 1);
            document.getElementById("next-btn").hidden = !(hasNext && activePage === 0);

            const mediaEl = document.getElementById("npc-media");
            mediaEl.onerror = () => { mediaEl.removeAttribute("src"); };
            if (page.media) {
                mediaEl.src = page.media;
                mediaEl.play().catch(() => {});
            } else {
                mediaEl.pause();
                mediaEl.removeAttribute("src");
            }

            setDialogOpen(true);
            typeWriterEffect(dialogTextEl, page.text);
        }

        function closeDialog() {
            setDialogOpen(false);
            document.querySelectorAll("[data-frame]").forEach((frame) => frame.classList.remove("is-selected"));
            activeEntry = null;
            activePage = 0;
            resetMedia();
        }

        function setDialogOpen(open) {
            const dialog = document.getElementById("dialog-box");
            dialog.classList.toggle("is-open", open);
            dialog.style.transform = open ? "translateY(0)" : "translateY(110%)";
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const dialogTextEl = document.getElementById("dialog-text");
            dialogTextEl.textContent = currentFullText;
            dialogTextEl.classList.remove("typing-cursor");
            const scroller = document.getElementById("dialog-scroll");
            scroller.scrollTop = scroller.scrollHeight;
        }

        function typeWriterEffect(element, text) {
            let i = 0;
            clearInterval(typingInterval);
            element.classList.add("typing-cursor");
            const scroller = document.getElementById("dialog-scroll");
            scroller.scrollTop = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    scroller.scrollTop = scroller.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                    element.classList.remove("typing-cursor");
                }
            }, 20);
        }

        function resetMedia() {
            clearInterval(typingInterval);
            const mediaEl = document.getElementById("npc-media");
            if (!mediaEl) return;
            mediaEl.pause();
            if (mediaEl.readyState > 0) mediaEl.currentTime = 0;
        }

        document.addEventListener("keydown", (e) => {
            const dialogBox = document.getElementById("dialog-box");
            const open = dialogBox.classList.contains("is-open");
            if (e.key === "Escape") closeDialog();
            else if (e.key === " " && open) {
                e.preventDefault();
                skipTyping();
            }
        });
    </script>
</body>
</html>
