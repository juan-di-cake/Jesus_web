<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 引入 Tailwind CSS 與 Google 字體 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #000;
            font-family: 'Noto Serif TC', 'PingFang TC', serif;
            user-select: none;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 滿版自適應等比畫布 (嚴格鎖定 16:9) */
        .stage-container {
            width: 100vw;
            height: 56.25vw; /* 100 * 9 / 16 */
            max-height: 100vh;
            max-width: 177.78vh; /* 100 * 16 / 9 */
            position: relative;
            background: #0d0b09;
            padding: 4px;
        }

        /* 依原圖分割比例切分網格佈局 */
        .grid-container {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: 382fr 111fr 565fr 382fr;
            grid-template-rows: 277fr 235fr 63fr 161fr 77fr 211fr;
            gap: 4px;
        }

        /* 共用 Frame 設定 */
        .frame {
            position: relative;
            background: #1e1914;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid rgba(212, 163, 89, 0.25);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        box-shadow 0.25s ease, 
                        border-color 0.25s ease, 
                        z-index 0s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* 滑鼠 Hover 選取回饋 */
        .frame:hover {
            transform: scale(1.018); 
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6), inset 0 0 10px rgba(245, 158, 11, 0.25);
            z-index: 30;
        }

        .frame:active {
            transform: scale(0.99);
        }

        /* 圖片填滿 Frame */
        .media-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; 
            pointer-events: none; 
            transition: filter 0.25s ease;
        }

        .frame:hover .media-content {
            filter: brightness(1.04) contrast(1.02);
        }

        /* 精確網格格位對應 (九宮/十格完整排版) */
        .frame-1  { grid-area: 1 / 1 / 2 / 2; } /* 1. 睚魯是誰？ */
        .frame-3  { grid-area: 2 / 1 / 3 / 2; } /* 2. 十二歲女孩 */
        .frame-2  { grid-area: 3 / 1 / 5 / 3; } /* 3. 喪葬文化 */
        .frame-4  { grid-area: 5 / 1 / 7 / 3; } /* 4. 耶穌觸摸死人，有何意義？ */
        .frame-8  { grid-area: 1 / 2 / 3 / 4; } /* 耶穌與女孩主圖 */
        .frame-5  { grid-area: 3 / 3 / 6 / 4; } /* 5. 加利利住宅 */
        .frame-6  { grid-area: 6 / 3 / 7 / 5; } /* 9. 房間與家具細節 */
        .frame-10 { grid-area: 1 / 4 / 2 / 5; } /* 6. 亞蘭文：「大利大，古米！」 */
        .frame-9  { grid-area: 2 / 4 / 4 / 5; } /* 7. 考古發現的相關文物 */
        .frame-7  { grid-area: 4 / 4 / 6 / 5; } /* 8. 舊約律法與背景 */

        /* 古典金色打字光標特效 */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #f59e0b;
            font-weight: 900;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 163, 67, 0.4);
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        // ================= 1. 資源載入監控邏輯 =================
        document.addEventListener("DOMContentLoaded", () => {
            const images = document.querySelectorAll('.media-content');
            const totalResources = images.length;
            let loadedResources = 0;
            const progressText = document.getElementById('loading-progress');
            const loadingScreen = document.getElementById('loading-screen');

            function updateProgress() {
                loadedResources++;
                let percent = Math.min(100, Math.floor((loadedResources / totalResources) * 100));
                progressText.textContent = `${percent}%`;

                if (loadedResources >= totalResources) {
                    setTimeout(() => {
                        loadingScreen.classList.add('opacity-0');
                        setTimeout(() => { loadingScreen.style.display = 'none'; }, 400);
                    }, 200);
                }
            }

            if (totalResources === 0) {
                loadingScreen.style.display = 'none';
            } else {
                images.forEach(img => {
                    if (img.complete && img.naturalWidth !== 0) {
                        updateProgress();
                    } else {
                        img.addEventListener('load', updateProgress);
                        img.addEventListener('error', updateProgress);
                    }
                });
            }

            setTimeout(() => {
                if (loadingScreen.style.display !== 'none') {
                    loadingScreen.classList.add('opacity-0');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 400);
                }
            }, 3000);
        });

        function handleImgFallback(imgElement, fallbackText) {
            const parent = imgElement.parentElement;
            imgElement.style.display = 'none';
            if (!parent.querySelector('.fallback-box')) {
                const box = document.createElement('div');
                box.className = 'fallback-box absolute inset-0 flex flex-col items-center justify-center p-3 text-center bg-[#211a14] text-amber-200 border border-amber-800/40 rounded';
                box.innerHTML = `<span class="text-xl mb-1">📜</span><p class="text-xs sm:text-sm font-semibold whitespace-pre-line leading-snug">${fallbackText}</p>`;
                parent.appendChild(box);
            }
        }

                text: "第一世紀的相關考古文物。作為照明用具的「油燈」、儲存油或水的「陶罐」、日常使用的「石碗」、磨穀物用的「磨石」、聖經抄本「經卷」，以及書寫用的「蘆葦筆」。這些真實的歷史物件，幫助我們更貼近當時的生活樣貌。",
                points: ["油燈與陶罐：生活必備器皿", "石碗：符合嚴格潔淨律法的器具", "經卷與蘆葦筆：會堂傳承律法與聖經之聖物"],
                media: 'https://juan-di-cake.github.io/Jesus_web/assets/Daughter/Voice/Thing.m4a'
            },
            10: {
                tag: "語言考據",
                name: "6. 亞蘭文：「大利大，古米！」（Talitha Koum）",
                text: "《馬可福音》特別保留了耶穌當時說的亞蘭文原音：「大利大，古米！」意思是：「小女孩，我吩咐妳起來！」這句直接與女孩對話的溫柔呼喚，不僅充滿了極大的憐憫，更彰顯了祂喚醒生命的絕對權柄。",
                points: ["亞蘭語：第一世紀加利利民間通行的日常語言", "Talitha：充滿疼愛的親暱稱呼（小羊羔、小女孩）", "聖經特意保留原文，傳遞臨場震撼與溫暖力量"],
                media: 'https://juan-di-cake.github.io/Jesus_web/assets/Daughter/Voice/Aramaic.m4a'
            }
        };

        // ================= 3. 互動對話控制 =================
        let typingInterval = null;
        let currentFullText = "";

        function handleFrameClick(frameNumber) {
            const data = frameData[frameNumber];
            if (data) {
                showDialog(data.tag, data.name, data.text, data.points, data.media);
            }
        }

        function showDialog(tag, name, text, points = [], mediaSrc = '') {
            resetMedia();
            const dialogBox = document.getElementById('dialog-box');
            document.getElementById('dialog-tag').textContent = tag || "考據細節";
            document.getElementById('dialog-name').textContent = name;
            
            const dialogTextEl = document.getElementById('dialog-text');
            dialogTextEl.textContent = ""; 
            currentFullText = text;

            const extraContainer = document.getElementById('dialog-extra');
            extraContainer.innerHTML = '';
            if (points && points.length > 0) {
                points.forEach(pt => {
                    const badge = document.createElement('span');
                    badge.className = 'bg-amber-950/80 text-amber-200 border border-amber-700/50 px-2 py-0.5 rounded text-xs';
                    badge.textContent = `✦ ${pt}`;
                    extraContainer.appendChild(badge);
                });
            }

            const mediaEl = document.getElementById('npc-media');
            if (mediaSrc) {
                mediaEl.src = mediaSrc;
                mediaEl.classList.remove('hidden'); 
                mediaEl.play().catch(() => {});
            } else {
                mediaEl.classList.add('hidden');
                mediaEl.src = "";
            }

            dialogBox.classList.remove('translate-y-full');
            typeWriterEffect(dialogTextEl, text);
        }

        function closeDialog() {
            document.getElementById('dialog-box').classList.add('translate-y-full');
            resetMedia();
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const dialogTextEl = document.getElementById('dialog-text');
            dialogTextEl.textContent = currentFullText;
            dialogTextEl.classList.remove('typing-cursor');
        }

        function typeWriterEffect(element, text) {
            let i = 0;
            clearInterval(typingInterval);
            element.classList.add('typing-cursor');

            typingInterval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    element.classList.remove('typing-cursor');
                }
            }, 20); 
        }

        function resetMedia() {
            clearInterval(typingInterval);
            const mediaEl = document.getElementById('npc-media');
            if (mediaEl) {
                mediaEl.pause();
                mediaEl.currentTime = 0;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDialog();
            } else if (e.key === ' ' && !document.getElementById('dialog-box').classList.contains('translate-y-full')) {
                e.preventDefault();
                skipTyping();
            }
        });
    </script>
</body>
</html>
