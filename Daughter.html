<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睚魯女兒的神蹟：背景文化細節圖解</title>
    
    <!-- 引入 Tailwind CSS 與 Google 字體 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #0b0907;
            font-family: 'Noto Serif TC', 'PingFang TC', serif;
            user-select: none;
            color: #f3f4f6;
        }

        /* 頂部標題列 */
        .header-bar {
            height: 48px;
            background: linear-gradient(180deg, rgba(20, 15, 10, 0.95) 0%, rgba(10, 8, 5, 0.85) 100%);
            border-bottom: 1px solid rgba(217, 163, 67, 0.35);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* 主網格畫布容器 */
        .canvas-area {
            height: calc(100vh - 48px);
            width: 100vw;
            padding: 6px;
            background: #0d0b09;
        }

        /* 依原圖切分之流體網格佈局 */
        .grid-container {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: 382fr 111fr 565fr 382fr;
            grid-template-rows: 277fr 235fr 63fr 161fr 77fr 211fr;
            gap: 4px;
        }

        /* 共用 Frame 設定 */
        .frame {
            position: relative;
            background: #1e1914;
            overflow: hidden;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid rgba(212, 163, 89, 0.2);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        box-shadow 0.28s ease, 
                        border-color 0.28s ease, 
                        z-index 0s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* 滑鼠 Hover 與選取回饋 */
        .frame:hover {
            transform: scale(1.025); 
            border-color: #f59e0b;
            box-shadow: 0 0 22px rgba(245, 158, 11, 0.6), inset 0 0 12px rgba(245, 158, 11, 0.2);
            z-index: 25;
        }

        .frame:active {
            transform: scale(0.99);
        }

        /* 懸浮提示角標 */
        .frame-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(15, 10, 5, 0.82);
            border: 1px solid rgba(245, 158, 11, 0.6);
            color: #fbbf24;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            opacity: 0.85;
            transition: opacity 0.2s, background 0.2s;
            pointer-events: none;
            z-index: 5;
        }
        .frame:hover .frame-badge {
            opacity: 1;
            background: rgba(245, 158, 11, 0.95);
            color: #111;
        }

        /* 圖片與媒體填滿 Frame */
        .media-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* 完全貼合網格預留比例 */
            pointer-events: none; 
            transition: filter 0.3s ease;
        }

        .frame:hover .media-content {
            filter: brightness(1.05) contrast(1.02);
        }

        /* 網格區塊對應定位 (嚴格符合九宮/十格拆解) */
        .frame-1  { grid-area: 1 / 1 / 2 / 2; } /* 1. 睚魯是誰？ */
        .frame-3  { grid-area: 2 / 1 / 3 / 2; } /* 2. 十二歲的女孩 */
        .frame-2  { grid-area: 3 / 1 / 5 / 3; } /* 3. 猶太人的喪葬文化 */
        .frame-4  { grid-area: 5 / 1 / 7 / 3; } /* 4. 耶穌觸摸死人，有何意義？ */
        .frame-8  { grid-area: 1 / 2 / 3 / 4; } /* 耶穌與女孩主圖 */
        .frame-5  { grid-area: 3 / 3 / 6 / 4; } /* 5. 第一世紀加利利住宅 */
        .frame-6  { grid-area: 6 / 3 / 7 / 5; } /* 9. 房間與家具細節 */
        .frame-10 { grid-area: 1 / 4 / 2 / 5; } /* 6. 亞蘭文：「大利大，古米！」 */
        .frame-9  { grid-area: 2 / 4 / 4 / 5; } /* 7. 考古發現的相關文物 */
        .frame-7  { grid-area: 4 / 4 / 6 / 5; } /* 8. 舊約律法與背景 */

        /* 古典金色打字光標特效 */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #f59e0b;
            font-weight: 900;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 163, 67, 0.4);
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        // ================= 1. 資源載入監控邏輯 =================
        document.addEventListener("DOMContentLoaded", () => {
            const images = document.querySelectorAll('.media-content');
            const totalResources = images.length;
            let loadedResources = 0;
            const progressText = document.getElementById('loading-progress');
            const loadingScreen = document.getElementById('loading-screen');

            function updateProgress() {
                loadedResources++;
                let percent = Math.min(100, Math.floor((loadedResources / totalResources) * 100));
                progressText.textContent = `${percent}%`;

                if (loadedResources >= totalResources) {
                    setTimeout(() => {
                        loadingScreen.classList.add('opacity-0');
                        setTimeout(() => { 
                            loadingScreen.style.display = 'none'; 
                        }, 500);
                    }, 250);
                }
            }

            if (totalResources === 0) {
                loadingScreen.style.display = 'none';
            } else {
                images.forEach(img => {
                    if (img.complete && img.naturalWidth !== 0) {
                        updateProgress();
                    } else {
                        img.addEventListener('load', updateProgress);
                        img.addEventListener('error', updateProgress);
                    }
                });
            }

            // 安全超時：若資源卡住3秒後自動進入主畫面
            setTimeout(() => {
                if (loadingScreen.style.display !== 'none') {
                    loadingScreen.classList.add('opacity-0');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
                }
            }, 3000);
        });

        // 圖片載入失敗時的優雅文字 Fallback
        function handleImgFallback(imgElement, fallbackText) {
            const parent = imgElement.parentElement;
            imgElement.style.display = 'none';
            if (!parent.querySelector('.fallback-box')) {
                const box = document.createElement('div');
                box.className = 'fallback-box absolute inset-0 flex flex-col items-center justify-center p-3 text-center bg-[#211a14] text-amber-200 border border-amber-800/40 rounded';
                box.innerHTML = `<span class="text-xl mb-1">📜</span><p class="text-xs sm:text-sm font-semibold whitespace-pre-line leading-snug">${fallbackText}</p>`;
                parent.appendChild(box);
            }
        }

        // ================= 3. 互動對話控制與音效邏輯 =================
        let typingInterval = null;
        let currentFullText = "";
        let audioFxEnabled = true;
        let audioCtx = null;

        // 簡易 Web Audio API 提示音 (無需外部音檔)
        function playChime(freq = 587.33, type = "sine") {
            if (!audioFxEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch (e) {
                console.log("Audio not allowed yet:", e);
            }
        }

        function toggleAudioFx() {
            audioFxEnabled = !audioFxEnabled;
            document.getElementById('audio-status').textContent = audioFxEnabled ? "開" : "關";
            document.getElementById('audio-icon').textContent = audioFxEnabled ? "🔔" : "🔕";
            if (audioFxEnabled) playChime(659.25);
        }

        // 點擊 Frame 觸發
        function handleFrameClick(frameNumber) {
            playChime(523.25 + frameNumber * 25);
            const data = frameData[frameNumber];
            if (data) {
                showDialog(data.tag, data.name, data.text, data.points, data.media);
            }
        }

        // 顯示對話框
        function showDialog(tag, name, text, points = [], mediaSrc = '') {
            resetMedia();
            const dialogBox = document.getElementById('dialog-box');
            document.getElementById('dialog-tag').textContent = tag || "考據細節";
            document.getElementById('dialog-name').textContent = name;
            
            const dialogTextEl = document.getElementById('dialog-text');
            dialogTextEl.textContent = ""; 
            currentFullText = text;

            // 渲染重點標籤列
            const extraContainer = document.getElementById('dialog-extra');
            extraContainer.innerHTML = '';
            if (points && points.length > 0) {
                points.forEach(pt => {
                    const badge = document.createElement('span');
                    badge.className = 'bg-amber-950/80 text-amber-200 border border-amber-700/50 px-2 py-0.5 rounded text-xs';
                    badge.textContent = `✦ ${pt}`;
                    extraContainer.appendChild(badge);
                });
            }

            // 支援外部音訊
            const mediaEl = document.getElementById('npc-media');
            if (mediaSrc) {
                mediaEl.src = mediaSrc;
                mediaEl.classList.remove('hidden'); 
                mediaEl.play().catch(() => {});
            } else {
                mediaEl.classList.add('hidden');
                mediaEl.src = "";
            }

            // 滑出對話框
            dialogBox.classList.remove('translate-y-full');
            typeWriterEffect(dialogTextEl, text);
        }

        // 關閉對話框
        function closeDialog() {
            document.getElementById('dialog-box').classList.add('translate-y-full');
            resetMedia();
            playChime(392.00);
        }

        // 跳過打字機直接展開全文
        function skipTyping() {
            clearInterval(typingInterval);
            const dialogTextEl = document.getElementById('dialog-text');
            dialogTextEl.textContent = currentFullText;
            dialogTextEl.classList.remove('typing-cursor');
        }

        // 打字機特效
        function typeWriterEffect(element, text) {
            let i = 0;
            clearInterval(typingInterval);
            element.classList.add('typing-cursor');

            typingInterval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    element.classList.remove('typing-cursor');
                }
            }, 22); 
        }

        // 重置媒體與定時器
        function resetMedia() {
            clearInterval(typingInterval);
            const mediaEl = document.getElementById('npc-media');
            if (mediaEl) {
                mediaEl.pause();
                mediaEl.currentTime = 0;
            }
        }

        // 鍵盤快捷鍵：ESC 關閉對話框、空白鍵展開全文
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDialog();
            } else if (e.key === ' ' && !document.getElementById('dialog-box').classList.contains('translate-y-full')) {
                e.preventDefault();
                skipTyping();
            }
        });
    </script>
