<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平靜風和海：考古與細節統整表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: #140e0a;
            color: #3a2415;
            font-family: "Noto Serif TC", "PingFang TC", "PMingLiU", serif;
            line-height: 1.35;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage {
            position: relative;
            aspect-ratio: 1024 / 572;
            width: min(100%, calc(100vh * 1024 / 572));
            max-height: 100%;
            min-width: 0;
            background: #d7c4a2;
            container-type: size;
            overflow: hidden;
        }

        .masthead { display: none; }

        .kicker {
            color: #6b4a2a;
            font-size: clamp(9px, 2.1cqh, 14px);
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin-top: 0.3cqh;
            color: #3a2415;
            font-size: clamp(14px, 4.4cqh, 32px);
            font-weight: 900;
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        .lede {
            margin-top: 0.5cqh;
            color: #4a301c;
            font-size: clamp(9px, 2.15cqh, 15px);
            line-height: 1.45;
        }

        .frame {
            position: absolute;
            z-index: 1;
            padding: 0;
            border: 0;
            background: #d7c4a2;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            transform-origin: center;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .frame:hover,
        .frame:focus-visible {
            z-index: 8;
            transform: scale(1.12);
            box-shadow: 0 0 0 3px #f5c518;
            outline: none;
        }

        .frame.is-selected {
            z-index: 7;
            box-shadow: 0 0 0 3px #f5c518;
        }

        .frame:hover.is-selected,
        .frame:focus-visible.is-selected {
            z-index: 8;
            transform: scale(1.12);
        }

        .shot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .caption {
            position: absolute;
            z-index: 1;
            top: 0.55cqh;
            left: 0.55cqw;
            right: 0.55cqw;
            padding: 0.28cqh 0.45cqw;
            background: rgba(243, 230, 200, 0.9);
            color: #3a2415;
            font-size: clamp(8px, 2.15cqh, 14px);
            font-weight: 900;
            line-height: 1.25;
            pointer-events: none;
        }

        .poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            z-index: 2;
            border: 3px solid transparent;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .hotspot:hover,
        .hotspot:focus-visible,
        .hotspot.is-selected {
            z-index: 8;
            border-color: #f5c518;
            outline: none;
        }

        .hotspot.s1 { left: 0.8%; top: 10%; width: 27.5%; height: 29%; }
        .hotspot.s2 { left: 0.8%; top: 39%; width: 27.5%; height: 27%; }
        .hotspot.sscene { left: 28.3%; top: 6%; width: 42.7%; height: 60%; }
        .hotspot.s4 { left: 71%; top: 6%; width: 28%; height: 21%; }
        .hotspot.s5 { left: 71%; top: 27%; width: 28%; height: 20%; }
        .hotspot.s6 { left: 71%; top: 47%; width: 28%; height: 19%; }
        .hotspot.s3 { left: 0.8%; top: 66%; width: 18.5%; height: 26%; }
        .hotspot.s7 { left: 19.3%; top: 66%; width: 17.5%; height: 26%; }
        .hotspot.s8 { left: 36.8%; top: 66%; width: 21%; height: 26%; }
        .hotspot.s9 { left: 57.8%; top: 66%; width: 20%; height: 26%; }
        .hotspot.s10 { left: 77.8%; top: 66%; width: 21.2%; height: 26%; }

        .f1, .f2, .f3 { left: 0; width: 17%; }
        .hero { left: 16.5%; width: 67.1%; }
        .f4, .f5, .f6 { left: 83.2%; width: 16.8%; }
        .f1, .f4 { top: 0; height: 21.4%; }
        .f2, .f5 { top: 20.8%; height: 21.4%; }
        .f3, .f6 { top: 41.6%; height: 21.7%; }
        .hero { top: 0; height: 63.3%; }
        .f7, .f8, .f9, .f10 { top: 62.9%; height: 32%; }
        .f7 { left: 0; width: 25.4%; }
        .f8 { left: 24.9%; width: 25.4%; }
        .f9 { left: 49.8%; width: 25.4%; }
        .f10 { left: 74.7%; width: 25.3%; }

        .footnote {
            position: absolute;
            z-index: 6;
            left: 0;
            top: 94.6%;
            width: 100%;
            height: 5.4%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.2cqw;
            background: #3a2415;
            color: #f6e6c4;
            font-size: clamp(8px, 2cqh, 14px);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.35;
            text-align: center;
            pointer-events: none;
        }

        .typing-cursor::after {
            content: "|";
            animation: blink 0.8s infinite;
            color: #f59e0b;
            font-weight: 900;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #dialog-box {
            transform: translateY(110%);
            transition: transform 0.3s ease;
        }

        #dialog-box.is-open { transform: translateY(0); }

        #dialog-scroll { max-height: 22vh; overflow-y: auto; }
        #dialog-scroll::-webkit-scrollbar,
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 163, 67, 0.45);
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .frame,
            #dialog-box,
            #loading-screen { transition: none; }
            .frame:hover,
            .frame:focus-visible,
            .frame:hover.is-selected,
            .frame:focus-visible.is-selected { transform: none; }
            .typing-cursor::after { animation: none; }
        }
    </style>
</head>
<body>
    <div id="loading-screen" style="position:fixed;inset:0;z-index:200;background:#140e0a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s ease;">
        <div style="width:3.5rem;height:3.5rem;border:4px solid rgba(120,80,20,.35);border-top-color:#f59e0b;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:.8rem;"></div>
        <h2 style="font-size:1.25rem;font-weight:700;color:#fbbf24;letter-spacing:.2em;margin-bottom:.25rem;">平靜風和海</h2>
        <p style="color:rgba(253,230,138,.7);font-size:.8rem;">馬可福音 4:35-41　<span id="loading-progress" style="color:#fbbf24;font-weight:700;">0%</span></p>
    </div>

    <div class="stage" id="stage">
        <img class="poster" id="poster" src="assets/sea/poster.png" alt="">
        <button type="button" class="hotspot sscene" data-frame="scene" title="平靜風和海"></button>
        <button type="button" class="hotspot s1" data-frame="1" title="1. 加利利湖：地理與特色"></button>
        <button type="button" class="hotspot s2" data-frame="2" title="2. 為何常有致命暴風？"></button>
        <button type="button" class="hotspot s3" data-frame="3" title="3. 漁業與經濟命脈"></button>
        <button type="button" class="hotspot s4" data-frame="4" title="4. 角色服裝與打扮"></button>
        <button type="button" class="hotspot s5" data-frame="5" title="5. 舊約背景：只有神能掌管海"></button>
        <button type="button" class="hotspot s6" data-frame="6" title="6. 耶穌的權柄"></button>
        <button type="button" class="hotspot s7" data-frame="7" title="7. 船上角色分工與狀態"></button>
        <button type="button" class="hotspot s8" data-frame="8" title="8. 第一世紀加利利漁船"></button>
        <button type="button" class="hotspot s9" data-frame="9" title="9. 船隻裝備與實物道具"></button>
        <button type="button" class="hotspot s10" data-frame="10" title="10. 相關考古小知識"></button>
    </div>

    <div id="dialog-box" style="position:fixed;left:0;bottom:0;width:100%;background:#16110c;border-top:2px solid rgba(245,158,11,.8);color:#fffbeb;padding:1rem 1.15rem 1.15rem;box-shadow:0 -10px 35px rgba(0,0,0,.85);z-index:50;">
        <div style="max-width:56rem;margin:0 auto;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;margin-bottom:.5rem;padding-bottom:.45rem;border-bottom:1px solid rgba(120,70,20,.55);">
                <div style="display:flex;align-items:center;gap:.6rem;min-width:0;">
                    <span id="dialog-tag" style="flex:0 0 auto;padding:.1rem .55rem;font-size:.72rem;font-weight:700;background:#f59e0b;color:#1a120c;border-radius:.25rem;letter-spacing:.04em;">地理</span>
                    <h3 id="dialog-name" style="color:#fcd34d;font-size:1.15rem;font-weight:700;letter-spacing:.04em;">主題名稱</h3>
                </div>
                <div style="display:flex;align-items:center;gap:.4rem;flex:0 0 auto;">
                    <button type="button" id="skip-btn" style="font-size:.75rem;color:rgba(252,211,77,.85);background:rgba(69,36,8,.65);padding:.2rem .5rem;border-radius:.25rem;border:1px solid rgba(180,120,40,.45);cursor:pointer;">展開全文</button>
                    <button type="button" id="close-btn" style="color:rgba(252,211,77,.8);background:rgba(120,70,20,.4);border:0;border-radius:999px;width:1.7rem;height:1.7rem;cursor:pointer;">✕</button>
                </div>
            </div>
            <audio id="npc-media" hidden></audio>
            <div id="dialog-scroll">
                <p id="dialog-text" class="typing-cursor" style="display:block;font-size:1rem;line-height:1.7;color:#e7e5e4;"></p>
            </div>
            <div id="dialog-extra" style="margin-top:.7rem;padding-top:.45rem;border-top:1px solid rgba(120,70,20,.4);display:flex;flex-wrap:wrap;gap:.4rem;"></div>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
        const frameData = {
            scene: {
                tag: "場景",
                name: "平靜風和海",
                text: "加利利湖是第一世紀重要的漁業與交通樞紐，但其獨特的盆地地形常引發致命的突發暴風，讓世世代生長於此的子民對這片深水充滿敬畏。耶穌斥責風浪。門徒掌舵。門徒舀水。驚濤駭浪。加利利海盆地。耶穌不只平靜風浪，更掌管我們生命中的風浪。當我們害怕時，祂仍在船上，並且有權柄賜下帶來平安。",
                points: ["耶穌斥責風浪", "門徒掌舵", "門徒舀水", "驚濤駭浪", "加利利海盆地"]
            },
            1: {
                tag: "地理",
                name: "1. 加利利湖：地理與特色",
                text: "加利利湖位於以色列北部，面積約166平方公里。它是低於海平面210公尺的最低淡水湖，也是第一世紀重要的交通要道。",
                points: ["伯賽大", "迦百農", "提比哩亞", "隱及迪", "Sea of Galilee"],
                media: "assets/sea/Voice/galilee.m4a"
            },
            2: {
                tag: "氣象",
                name: "2. 為何常有致命暴風？",
                text: "這裡常發生致命暴風，是因為湖面四周高山環繞，形成「漏斗狀風道」。當黑門山的冷空氣與湖面的暖濕空氣劇烈交會時，就會突然掀起狂風暴雨。",
                points: ["冷空氣（黑門山）", "漏斗狀風道", "暖濕空氣", "致命暴風"],
                media: "assets/sea/Voice/weather.m4a"
            },
            3: {
                tag: "經濟",
                name: "3. 漁業與經濟命脈",
                text: "捕魚業是一世紀的經濟中心，門徒們本就非常熟悉湖象。連這群專業漁夫都感到驚恐，可見這場風暴異常駭人。",
                points: ["捕魚業是一世紀經濟中心", "門徒熟知湖象"],
                media: "assets/sea/Voice/economy.m4a"
            },
            4: {
                tag: "服裝",
                name: "4. 角色服裝與打扮",
                text: "畫中耶穌穿著長袍；而門徒們則是穿著粗糙的無袖短袍，這是為了方便他們在船上攀舵與舀水等勞動。",
                points: ["耶穌長袍", "漁夫短袍"],
                media: "assets/sea/Voice/clothing.m4a"
            },
            5: {
                tag: "舊約",
                name: "5. 舊約背景：只有神能掌管海",
                text: "在古代近東文化中，深海象徵著混亂與死亡。舊約的《詩篇》與《約伯記》都記載著，唯有神能夠「管轄海的狂傲」。",
                points: ["詩篇 89:9", "約伯記 38:8-11"],
                media: "assets/sea/Voice/old_testament.m4a"
            },
            6: {
                tag: "權柄",
                name: "6. 耶穌的權柄",
                text: "呼應前面的背景，耶穌平息風暴不需要任何儀式或咒語。祂僅憑一句「住了吧！靜了吧！」就讓自然界順服，這顯明了祂超越人類、等同於神的權柄。",
                points: ["住了吧！靜了吧！"],
                media: "assets/sea/Voice/authority.m4a"
            },
            7: {
                tag: "船上",
                name: "7. 船上角色分工與狀態",
                text: "在風暴的混亂中，船上每個人狀態不同：有人努力保持船頭穩定，有人拚命舀水，還有人驚慌求救，絕望地搖醒耶穌。",
                points: ["掌舵者", "舀水者", "驚慌求救者"],
                media: "assets/sea/Voice/roles.m4a"
            },
            8: {
                tag: "船隻",
                name: "8. 第一世紀加利利漁船",
                text: "根據1986年的考古發現，這是一艘長8.2公尺、寬2.3公尺的船隻，大約可容納13到15人。它的平底設計雖適合淺水捕魚，但在狂風中卻極容易翻覆。",
                points: ["1986 Discovery", "長 8.2 公尺", "寬 2.3 公尺", "容納 13–15 人"],
                media: "assets/sea/Voice/fishing_boat.m4a"
            },
            9: {
                tag: "裝備",
                name: "9. 船隻裝備與實物道具",
                text: "這艘船配有單桅帆與四支木槳。特別的是，聖經記載耶穌熟睡時墊的枕頭，其實是當時漁船船尾甲板下的沙袋或皮墊。",
                points: ["單桅帆", "四支木槳", "船尾沙袋枕頭"],
                media: "assets/sea/Voice/boat_props.m4a"
            },
            10: {
                tag: "考古",
                name: "10. 相關考古小知識",
                text: "這裡展示了加利利出土的一世紀文物，包含陶製油燈、石錨、漁網鉛錘與木製船槳，真實還原了當時水手與漁夫的生活工具。",
                points: ["陶製油燈", "石錨", "漁網鉛錘", "木製船槳"],
                media: "assets/sea/Voice/fun_facts.m4a"
            }
        };

        const images = document.querySelectorAll("#poster");
        const progressText = document.getElementById("loading-progress");
        const loadingScreen = document.getElementById("loading-screen");
        let loadedResources = 0;

        function updateProgress() {
            loadedResources++;
            progressText.textContent = Math.min(100, Math.floor((loadedResources / images.length) * 100)) + "%";
            if (loadedResources >= images.length) {
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => { loadingScreen.style.display = "none"; }, 400);
                }, 200);
            }
        }

        images.forEach((img) => {
            if (img.complete && img.naturalWidth !== 0) updateProgress();
            else {
                img.addEventListener("load", updateProgress);
                img.addEventListener("error", updateProgress);
            }
        });

        let typingInterval = null;
        let currentFullText = "";

        document.querySelectorAll("[data-frame]").forEach((frame) => {
            frame.addEventListener("click", () => openFrame(frame.dataset.frame));
        });

        document.getElementById("close-btn").addEventListener("click", closeDialog);
        document.getElementById("skip-btn").addEventListener("click", skipTyping);

        function openFrame(id) {
            const data = frameData[id];
            if (!data) return;
            document.querySelectorAll("[data-frame]").forEach((frame) => {
                frame.classList.toggle("is-selected", frame.dataset.frame === id);
            });
            showDialog(data);
        }

        function showDialog(data) {
            resetMedia();
            document.getElementById("dialog-tag").textContent = data.tag || "考據";
            document.getElementById("dialog-name").textContent = data.name;
            const dialogTextEl = document.getElementById("dialog-text");
            dialogTextEl.textContent = "";
            currentFullText = data.text;

            const extraContainer = document.getElementById("dialog-extra");
            extraContainer.innerHTML = "";
            (data.points || []).forEach((pt) => {
                const badge = document.createElement("span");
                badge.style.cssText = "background:rgba(69,26,8,.85);color:#fde68a;border:1px solid rgba(180,120,40,.5);padding:.1rem .45rem;border-radius:.25rem;font-size:.75rem;";
                badge.textContent = "✦ " + pt;
                extraContainer.appendChild(badge);
            });

            const mediaEl = document.getElementById("npc-media");
            mediaEl.onerror = () => {
                mediaEl.removeAttribute("src");
            };
            if (data.media) {
                mediaEl.src = data.media;
                mediaEl.play().catch(() => {});
            } else {
                mediaEl.removeAttribute("src");
            }

            setDialogOpen(true);
            typeWriterEffect(dialogTextEl, data.text);
        }

        function closeDialog() {
            setDialogOpen(false);
            document.querySelectorAll("[data-frame]").forEach((frame) => frame.classList.remove("is-selected"));
            resetMedia();
        }

        function setDialogOpen(open) {
            const dialog = document.getElementById("dialog-box");
            dialog.classList.toggle("is-open", open);
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const dialogTextEl = document.getElementById("dialog-text");
            dialogTextEl.textContent = currentFullText;
            dialogTextEl.classList.remove("typing-cursor");
            const scroller = document.getElementById("dialog-scroll");
            scroller.scrollTop = scroller.scrollHeight;
        }

        function typeWriterEffect(element, text) {
            let i = 0;
            clearInterval(typingInterval);
            element.classList.add("typing-cursor");
            const scroller = document.getElementById("dialog-scroll");
            scroller.scrollTop = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    scroller.scrollTop = scroller.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                    element.classList.remove("typing-cursor");
                }
            }, 20);
        }

        function resetMedia() {
            clearInterval(typingInterval);
            const mediaEl = document.getElementById("npc-media");
            if (!mediaEl) return;
            mediaEl.pause();
            try { if (mediaEl.readyState > 0) mediaEl.currentTime = 0; } catch (e) {}
        }

        document.addEventListener("keydown", (e) => {
            const open = document.getElementById("dialog-box").classList.contains("is-open");
            if (e.key === "Escape") closeDialog();
            else if (e.key === " " && open) {
                e.preventDefault();
                skipTyping();
            }
        });
    </script>
</body>
</html>
