<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迦拿婚宴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background: #140e0a;
            color: #3a2415;
            font-family: "Noto Serif TC", "PingFang TC", serif;
        }
        body { display: flex; align-items: center; justify-content: center; }
        .stage {
            position: relative;
            aspect-ratio: 1024 / 596;
            width: min(100%, calc(100vh * 1024 / 596));
            width: min(100%, calc(100dvh * 1024 / 596));
            height: min(100vh, calc(100vw * 596 / 1024));
            height: min(100dvh, calc(100vw * 596 / 1024));
            max-height: 100dvh;
            background: #d7c4a2;
            container-type: size;
            overflow: hidden;
        }
        .poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .poster.glow { opacity: 0; }
        .stage[data-glow="bride"] .glow[data-glow="bride"],
        .stage[data-glow="groom"] .glow[data-glow="groom"],
        .stage[data-glow="guest"] .glow[data-glow="guest"],
        .stage[data-glow="seating"] .glow[data-glow="seating"],
        .stage[data-glow="lamp"] .glow[data-glow="lamp"],
        .stage[data-glow="food"] .glow[data-glow="food"],
        .stage[data-glow="jars"] .glow[data-glow="jars"],
        .stage[data-glow="master"] .glow[data-glow="master"],
        .stage[data-glow="servant"] .glow[data-glow="servant"] {
            opacity: 1;
        }
        .hotspot {
            position: absolute;
            z-index: 2;
            border: 0;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }
        .hotspot:hover,
        .hotspot:focus-visible,
        .hotspot.is-selected {
            z-index: 8;
            outline: none;
        }
        .bride   { left: 1%;    top: 13.5%; width: 15.4%; height: 66%; }
        .groom   { left: 16.4%; top: 11%;   width: 14%;   height: 34.5%; }
        .guest   { left: 18%;   top: 44.5%; width: 14.6%; height: 46%; z-index: 4; }
        .seating { left: 33%;   top: 14.5%; width: 31.4%; height: 38%; z-index: 1; }
        .lamp    { left: 34.8%; top: 50%;   width: 11.6%; height: 39%; z-index: 5; }
        .food    { left: 46.8%; top: 54%;   width: 24%;   height: 37%; z-index: 3; }
        .jars    { left: 63.2%; top: 8.5%;  width: 17.4%; height: 35%; }
        .master  { left: 80.8%; top: 11.5%; width: 17.4%; height: 41%; z-index: 3; }
        .servant { left: 72.8%; top: 47%;   width: 25.6%; height: 44%; z-index: 4; }
        .flow-btn {
            position: absolute;
            z-index: 9;
            top: 0.7%;
            right: 0.7%;
            width: 5.2cqh;
            height: 5.2cqh;
            border: 0;
            border-radius: 50%;
            background: #3a2415;
            color: #f6e6c4;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 0 0 2px #d4920a;
        }
        .flow-btn svg { width: 58%; height: 58%; }
        .flow-btn:hover,
        .flow-btn:focus-visible,
        .flow-btn.is-selected {
            background: #5a3a22;
            box-shadow: 0 0 0 3px #f5c518;
            outline: none;
        }
        #dialog-box {
            position: fixed; left: 0; bottom: 0; width: 100%;
            background: #16110c; border-top: 2px solid rgba(245,158,11,.8);
            color: #fffbeb; padding: 1rem 1.15rem 1.15rem;
            box-shadow: 0 -10px 35px rgba(0,0,0,.85);
            transform: translateY(110%); transition: transform .3s ease; z-index: 50;
        }
        #dialog-box.is-open { transform: translateY(0); }
        #dialog-scroll { max-height: 22vh; overflow-y: auto; }
        .typing-cursor::after { content: "|"; animation: blink 0.8s infinite; color: #f59e0b; font-weight: 900; }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            #dialog-box { transition: none; }
            .typing-cursor::after { animation: none; }
        }
    </style>
</head>
<body>
    <div id="loading-screen" style="position:fixed;inset:0;z-index:200;background:#140e0a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
        <h2 style="color:#fbbf24;letter-spacing:.2em;">迦拿婚宴</h2>
        <p style="color:rgba(253,230,138,.7);">底圖載入中…</p>
    </div>
    <div class="stage">
        <img class="poster" id="poster" src="assets/wedding/poster.jpg" alt="">
        <img class="poster glow" data-glow="bride" src="assets/wedding/glow/bride.jpg" alt="">
        <img class="poster glow" data-glow="groom" src="assets/wedding/glow/groom.jpg" alt="">
        <img class="poster glow" data-glow="guest" src="assets/wedding/glow/guest.jpg" alt="">
        <img class="poster glow" data-glow="seating" src="assets/wedding/glow/seating.jpg" alt="">
        <img class="poster glow" data-glow="lamp" src="assets/wedding/glow/lamp.jpg" alt="">
        <img class="poster glow" data-glow="food" src="assets/wedding/glow/food.jpg" alt="">
        <img class="poster glow" data-glow="jars" src="assets/wedding/glow/jars.jpg" alt="">
        <img class="poster glow" data-glow="master" src="assets/wedding/glow/master.jpg" alt="">
        <img class="poster glow" data-glow="servant" src="assets/wedding/glow/servant.jpg" alt="">
        <button type="button" class="hotspot bride" data-frame="bride" data-glow="bride" title="新娘"></button>
        <button type="button" class="hotspot groom" data-frame="groom" data-glow="groom" title="新郎"></button>
        <button type="button" class="hotspot guest" data-frame="guest" data-glow="guest" title="賓客"></button>
        <button type="button" class="hotspot seating" data-frame="seating" data-glow="seating" title="座席方式"></button>
        <button type="button" class="hotspot lamp" data-frame="lamp" data-glow="lamp" title="燈具"></button>
        <button type="button" class="hotspot food" data-frame="food" data-glow="food" title="器皿與食物"></button>
        <button type="button" class="hotspot jars" data-frame="stone_jar" data-glow="jars" title="潔淨用石缸"></button>
        <button type="button" class="hotspot master" data-frame="master" data-glow="master" title="管宴席的人"></button>
        <button type="button" class="hotspot servant" data-frame="servant" data-glow="servant" title="僕人"></button>
        <button type="button" class="flow-btn" data-frame="flow" title="婚禮流程" aria-label="婚禮流程">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M5 6h14M5 12h14M5 18h9"/>
                <path d="M16 16l3 2-3 2"/>
            </svg>
        </button>
    </div>
    <div id="dialog-box">
        <div style="max-width:56rem;margin:0 auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.5rem;">
                <h3 id="dialog-name" style="color:#fcd34d;font-size:1.15rem;">角色名稱</h3>
                <div style="display:flex;gap:.4rem;">
                    <button type="button" id="skip-btn" style="font-size:.75rem;color:#fcd34d;background:rgba(69,36,8,.65);padding:.2rem .5rem;border:1px solid rgba(180,120,40,.45);cursor:pointer;">展開全文</button>
                    <button type="button" id="close-btn" style="color:#fcd34d;background:rgba(120,70,20,.4);border:0;border-radius:999px;width:1.7rem;height:1.7rem;cursor:pointer;">✕</button>
                </div>
            </div>
            <audio id="npc-media" hidden></audio>
            <div id="dialog-scroll"><p id="dialog-text" class="typing-cursor" style="line-height:1.7;color:#e7e5e4;"></p></div>
        </div>
    </div>
    <script>
        const frameData = {
            bride: {
                name: "👰 新娘 (Bride)",
                text: "辦一場婚禮真的很辛苦呢！我們不只要連續慶祝七天，還要邀請全村的人一起來參加喜宴。為了今天，我穿上了這件精心準備的禮服，上面有最高級的『金鑲繡花』。雖然戴著厚重的頭紗和頸飾有點重，但這是我一生中最榮耀、最美麗的時刻！",
                media: "https://juan-di-cake.github.io/Jesus_web/assets/wedding/dress.m4a"
            },
            groom: {
                name: "🤵 新郎 (Groom)",
                text: "感謝村裡的爸爸媽媽們這幾天來幫忙籌備喜宴。你們看我外袍上披著的這件『祈禱巾 (Tallit)』，邊緣還綁著特別的『繸子』。這是為了提醒我們，即使在歡慶的時刻，也不要忘記我們是上帝的子民，要時刻把祂的律法與恩典記在心裡。",
                media: "groom.mp4"
            },
            guest: {
                name: "🧔 賓客 (Guest)",
                text: "這場婚宴太棒了！我們脫下皮革涼鞋，斜躺在這種『ㄇ字型 (Tri-clinium)』的座席上，真的是非常放鬆舒服。能這樣和親朋好友們一起吃喝快樂，慶祝這對新人的結合，真是太有福了！",
                media: "guest.mp4"
            },
            seating: {
                name: "座席方式",
                text: "平民多使用地席、草席、靠墊與矮桌，非羅馬式躺椅。"
            },
            master: {
                name: "🍷 管筵席的人",
                text: "大家都給我盯緊點！我是這場婚宴的總策劃。你們知道要是這七天的喜宴上『酒喝盡了』，會面臨多可怕的後果嗎？這在我們的規矩裡是極大的羞辱！新郎家族不僅會身敗名裂，女方家屬甚至可以依據『未盡款待義務』提出法律訴訟，要求巨額的金錢賠償！這會毀了兩個家族的契約，我也會跟著完蛋！所以，把酒水看緊了，絕對不能出差錯！",
                media: "master.mp4"
            },
            servant: {
                name: "🧑‍🍳 服侍的僕人",
                text: "呼，這工作真不輕鬆！我們得不斷去打水，把這些巨大的『潔淨用石缸』裝滿。這可不是普通的罐子，每個都能裝下 80 到 120 公升的水呢！因為客人入席前都必須依照規矩洗手洗腳，這對我們來說可是個大工程！",
                media: "servant.mp4"
            },
            stone_jar: {
                name: "🏺 潔淨用石缸 (Limestone Jars)",
                text: "我是一顆沉重的灰石缸！我不裝酒，我只裝清澈的水。我是專門為了猶太人的『潔淨儀式』而打造的，因為石器不容易沾染不潔。等一下要是沒有水了，可別怪我呀！",
                media: "jars.mp4"
            },
            lamp: {
                name: "🪔 泥陶油燈 (Lighting)",
                text: "雖然我個子小，但我站在高高的燈臺上喔！婚宴到了晚上，就全靠我發出溫暖的光芒，照亮桌上的美食和每一位開心賓客的笑臉了。",
                media: "lamp.mp4"
            },
            food: {
                name: "🥖 器皿與食物",
                text: "看過來！我們是豐盛的無花果、葡萄，還有裝在木盤裡的烤肉與麵餅！當地常見的食物還有豆類、堅果跟香草等，我們被裝盛在精美的陶罐與木器中，可是這七天婚宴中大家最期待的主角呢！",
                media: "food.mp4"
            },
            flow: {
                name: "婚禮流程",
                text: "1. 訂婚 (Kiddushin)。2. 新郎迎娶。3. 遊行。4. 婚宴 (多日)。5. 祝福。6. 新房。"
            }
        };

        const poster = document.getElementById("poster");
        const loadingScreen = document.getElementById("loading-screen");
        const stage = document.querySelector(".stage");
        const pictures = document.querySelectorAll(".poster");
        let ready = 0;
        function hideLoading() {
            ready++;
            if (ready >= pictures.length) loadingScreen.style.display = "none";
        }
        pictures.forEach((img) => {
            if (img.complete && img.naturalWidth) hideLoading();
            else {
                img.addEventListener("load", hideLoading);
                img.addEventListener("error", hideLoading);
            }
        });

        let typingInterval = null;
        let currentFullText = "";
        let selectedGlow = "";

        function showGlow(id) {
            if (id) stage.dataset.glow = id;
            else delete stage.dataset.glow;
        }

        document.querySelectorAll("[data-frame]").forEach((frame) => {
            frame.addEventListener("pointerenter", () => {
                if (frame.dataset.glow) showGlow(frame.dataset.glow);
            });
            frame.addEventListener("pointerleave", () => showGlow(selectedGlow));
            frame.addEventListener("focus", () => {
                if (frame.dataset.glow) showGlow(frame.dataset.glow);
            });
            frame.addEventListener("blur", () => showGlow(selectedGlow));
            frame.addEventListener("click", () => openFrame(frame.dataset.frame));
        });
        document.getElementById("close-btn").addEventListener("click", closeDialog);
        document.getElementById("skip-btn").addEventListener("click", skipTyping);

        function openFrame(id) {
            const data = frameData[id];
            if (!data) return;
            const chosen = document.querySelector(`[data-frame="${id}"]`);
            if (chosen && chosen.dataset.glow) {
                selectedGlow = chosen.dataset.glow;
                showGlow(selectedGlow);
            }
            document.querySelectorAll("[data-frame]").forEach((frame) => {
                frame.classList.toggle("is-selected", frame.dataset.frame === id);
            });
            showDialog(data);
        }

        function showDialog(data) {
            resetMedia();
            document.getElementById("dialog-name").textContent = data.name;
            const textEl = document.getElementById("dialog-text");
            textEl.textContent = "";
            currentFullText = data.text;
            const mediaEl = document.getElementById("npc-media");
            if (data.media) {
                mediaEl.src = data.media;
                mediaEl.play().catch(() => {});
            } else {
                mediaEl.removeAttribute("src");
            }
            document.getElementById("dialog-box").classList.add("is-open");
            typeWriterEffect(textEl, data.text);
        }

        function closeDialog() {
            document.getElementById("dialog-box").classList.remove("is-open");
            document.querySelectorAll("[data-frame]").forEach((frame) => frame.classList.remove("is-selected"));
            selectedGlow = "";
            showGlow("");
            resetMedia();
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const textEl = document.getElementById("dialog-text");
            textEl.textContent = currentFullText;
            textEl.classList.remove("typing-cursor");
        }

        function typeWriterEffect(element, text) {
            let i = 0;
            clearInterval(typingInterval);
            element.classList.add("typing-cursor");
            typingInterval = setInterval(() => {
                if (i < text.length) element.textContent += text.charAt(i++);
                else {
                    clearInterval(typingInterval);
                    element.classList.remove("typing-cursor");
                }
            }, 20);
        }

        function resetMedia() {
            clearInterval(typingInterval);
            const mediaEl = document.getElementById("npc-media");
            mediaEl.pause();
            try { mediaEl.currentTime = 0; } catch (e) {}
        }

        document.addEventListener("keydown", (e) => {
            const open = document.getElementById("dialog-box").classList.contains("is-open");
            if (e.key === "Escape") closeDialog();
            else if (e.key === " " && open) { e.preventDefault(); skipTyping(); }
        });
    </script>
</body>
</html>
