<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>迦拿婚宴 - 沉浸式互動導覽</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  

  <style>
    body { font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden; margin: 0; padding: 0; background-color: #000; }
    
    @media screen and (orientation: portrait) {
      #portrait-warning { display: flex; }
    }
    @media screen and (orientation: landscape) {
      #portrait-warning { display: none; }
    }
    
    /* 針對去背圖片專用的互動特效 */
	.hotspot-img {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      /* 預設給予一點點陰影，讓去背圖稍微浮出底圖 */
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
      cursor: pointer;
	  
      background: transparent;
      border: none;
      padding: 0;
    }
    .hotspot-img:active, .hotspot-img:hover {
      /* 僅原地放大 15% (移除 translateY)，加上強烈的金色光暈 */
      transform: scale(1.15);
      filter: drop-shadow(0 8px 15px rgba(250, 204, 21, 0.8));
      z-index: 50;
    }
    
    /* 防止圖片被拖曳導致無法點擊 */
    
    /* 防止圖片被拖曳導致無法點擊 */
    .hotspot-img img {
      pointer-events: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
	  border: none;
    }
    
    #scene-2d { z-index: 10; transition: opacity 0.5s ease-in-out; }
    #scene-vr { z-index: 0; }
    #vr-ui { z-index: 20; }
  </style>
</head>
<body class="bg-black text-gray-800">

  <!-- ================= [層級 0] A-Frame VR 360 場景 ================= -->
<!--
  <div id="scene-vr" class="fixed inset-0 w-full h-full">
    <a-scene vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- 【替換點 1】 VR 環景圖 (360 Equirectangular Image) 
      <!-- 說明：將 src 換成您生成的 2:1 全景圖檔案路徑 (例如 src="pano.jpg") 
	<a-assets>
        <img id="boxTexture" src="VR.jpg">
       
    </a-assets>
    <a-scene>
      <!-- 也可以把圖片貼在天空球上，就能輕鬆做出 360 度環景相片效果！

<!-- ================= [層級 20] VR 模式下的 UI ================= -->
  <div id="vr-ui" class="fixed inset-0 pointer-events-none hidden opacity-0 transition-opacity duration-500">
    <button onclick="exitVR()" class="pointer-events-auto absolute top-4 left-4 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white px-4 py-2 rounded-full font-bold shadow-lg flex items-center gap-2">
      <span>←</span> 返回平面導覽
    </button>
  </div>

  <!-- ================= [層級 10] 2D 互動導覽主畫面 ================= -->
  <!-- 1. 將外層設為 flex 置中 -->
  <div id="scene-2d" class="fixed inset-0 w-full h-full bg-black flex items-center justify-center">
    
    <!-- 2. 核心畫布容器：鎖定 16:9 比例 (aspect-video)，最大寬度不超過螢幕高度的 16/9 (177.78vh) -->
    <!-- 這樣能保證不論螢幕多大、多寬，畫布比例永遠固定，內部的 % 定位絕對不會跑位 -->
    <div class="relative w-full aspect-video max-w-[177.78vh] max-h-[100vh] overflow-hidden">
      
      <!-- 【替換點 2】 2D 底圖 (因為外層比例已固定，這裡改用 object-cover 填滿畫布) -->
      <img src="back.png" alt="迦拿婚宴背景" class="w-full h-full object-cover opacity-95">
      
      <!-- ================= 核心人物角色去背圖 (觸發 RPG 語音對話) ================= -->
      
      <!-- 1. 新娘去背圖 -->
      <!-- 【替換點 3】 將固定大小改為百分比 w-[8%] h-[30%]，讓大小跟隨背景自動縮放 -->

              
      <img src="bride.png" class="hotspot-img absolute top-[20%] left-[2%] h-[49%]" alt="新娘" onclick="showDialog('👰 新娘 (Bride)', '辦一場婚禮真的很辛苦呢！我們不只要連續慶祝七天，還要邀請全村的人一起來參加喜宴。為了今天，我穿上了這件精心準備的禮服，上面有最高級的『金鑲繡花』。雖然戴著厚重的頭紗和頸飾有點重，但這是我一生中最榮耀、最美麗的時刻！')">

      
      <!-- 2. 新郎去背圖 -->
	  

      <img src="Groom.png" alt="新郎" onclick="showDialog('🤵 新郎 (Groom)', '感謝村裡的爸爸媽媽們這幾天來幫忙籌備喜宴。你們看我外袍上披著的這件『祈禱巾 (Tallit)』，邊緣還綁著特別的『繸子』。這是為了提醒我們，即使在歡慶的時刻，也不要忘記我們是上帝的子民，要時刻把祂的律法與恩典記在心裡。')" 
         class="hotspot-img absolute top-[25%] left-[19%]  h-[49%]"">


      <!-- 3. 賓客去背圖 -->
      <button onclick="showDialog('🧔 賓客 (Guest)', '這場婚宴太棒了！我們脫下皮革涼鞋，斜躺在這種『ㄇ字型 (Tri-clinium)』的座席上，真的是非常放鬆舒服。能這樣和親朋好友們一起吃喝快樂，慶祝這對新人的結合，真是太有福了！')" 
              class="hotspot-img absolute top-[50%] left-[20%] w-[25%] h-[50%]">
        <img src="Guest.png" alt="賓客">
      </button>
      
      <!-- 4. 管宴席的去背圖 -->
      <button onclick="showDialog('🍷 管筵席的', '大家都給我盯緊點！我是這場婚宴的總策劃。你們知道要是這七天的喜宴上『酒喝盡了』，會面臨多可怕的後果嗎？這在我們的規矩裡是極大的羞辱！新郎家族不僅會身敗名裂，女方家屬甚至可以依據『未盡款待義務』提出法律訴訟，要求巨額的金錢賠償！這會毀了兩個家族的契約，我也會跟著完蛋！所以，把酒水看緊了，絕對不能出差錯！')" 
              class="hotspot-img absolute top-[20%] left-[78%] w-[15%] h-[38%]">
        <img src="master.png" alt="管筵席的">
      </button>

      <!-- 5. 僕人去背圖 -->
      <button onclick="showDialog('🧑‍🍳 服侍的僕人', '呼，這工作真不輕鬆！我們得不斷去打水，把這些巨大的『潔淨用石罐』裝滿。這可不是普通的罐子，每個都能裝下 80 到 120 公升的水呢！因為客人入席前都必須依照規矩洗手洗腳，這對我們來說可是個大工程！')" 
              class="hotspot-img absolute top-[42%] left-[76%] w-[23%] h-[60%]">
        <img src="servant.png" alt="僕人">
      </button>

      <!-- ================= 實物道具去背圖 (彩蛋語音) ================= -->
      
      <!-- 6. 潔淨用石缸去背圖 -->
      <button onclick="showDialog('🏺 潔淨用石罐', '我是一顆沉重的灰石罐！我不裝酒，我只裝清澈的水。我是專門為了猶太人的『潔淨儀式』而打造的。等一下要是沒有水了，可別怪我呀！')" 
              class="hotspot-img absolute top-[20%] left-[65%] w-[12%] h-[25%]">
        <img src="jars.png" alt="石缸">
      </button>

      <!-- 7. 泥陶油燈去背圖 -->
      <button onclick="showDialog('🪔 泥陶油燈', '雖然我個子小，但我站在高高的燈臺上喔！婚宴到了晚上，就全靠我發出溫暖的光芒，照亮桌上的美食和每一位開心賓客的笑臉了。')" 
              class="hotspot-img absolute top-[50%] left-[45%] w-[6%] h-[70%]">
        <img src="lamp.png" alt="油燈">
      </button>

      <!-- 8. 餐桌美食去背圖 -->
      <button onclick="showDialog('🥖 餐桌美食', '看過來！我們是豐盛的無花果、葡萄，還有裝在木盤裡的烤肉與麵包！我們被裝盛在精美的『雙耳陶罐』旁邊，可是這七天婚宴中，大家最期待的主角呢！')" 
              class="hotspot-img absolute top-[60%] left-[55%] w-[18%] h-[20%]">
        <img src="food.png" alt="美食">
      </button>
      
      <!-- 9. 婚禮傳統 (維持一般按鈕，因為它是純知識標籤) -->
      <button onclick="showInfo('📜 猶太婚禮傳統流程', '整體的猶太傳統婚禮流程為：<br><br>1. 訂婚 (Kiddushin)<br>2. 新郎迎娶<br>3. 遊行<br>4. 婚宴 (多日)<br>5. 祝福<br>6. 進入新房')"

      <!-- === 進入 VR 按鈕 === -->
      <button onclick="enterVR()" class="absolute bottom-6 right-6 bg-gradient-to-r from-yellow-600 to-yellow-500 text-white px-5 py-2.5 rounded-full font-bold shadow-xl hover:scale-105 transition-transform flex items-center gap-2 z-40">
        <span class="text-xl">🌐</span> 進入 360 環景
      </button>
    </div>

    <!-- === RPG 對話框 UI === -->
    <div id="dialog-box" class="absolute bottom-0 w-full bg-black/85 backdrop-blur-md border-t-4 border-yellow-600 text-white p-4 pb-6 shadow-2xl transition-transform duration-300 transform translate-y-full flex flex-col justify-center items-center pointer-events-auto z-50">
      <div class="w-full max-w-3xl">
        <div class="flex justify-between items-center mb-2">
          <h3 id="dialog-name" class="text-yellow-400 font-bold text-xl drop-shadow">角色名稱</h3>
          <button onclick="closeDialog()" class="text-gray-300 hover:text-white bg-white/20 rounded-full w-8 h-8 flex items-center justify-center text-lg">✕</button>
        </div>
        <p id="dialog-text" class="text-lg leading-relaxed min-h-[3.5rem]">對話內容...</p>
      </div>
    </div>

    <!-- === 物件詳細資訊卡 UI === -->
    <div id="info-modal" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 bg-black/70 backdrop-blur-sm z-50">
      <div class="bg-[#f4ebd0] text-gray-900 rounded-xl shadow-2xl p-6 max-w-lg w-[85%] border-2 border-yellow-700/30 transform scale-95 transition-transform duration-300" id="info-content">
        <div class="flex justify-between items-start mb-4 border-b border-yellow-700/20 pb-2">
          <h2 id="info-title" class="text-2xl font-bold text-yellow-900">物件名稱</h2>
          <button onclick="closeInfo()" class="text-yellow-900 hover:text-black font-bold text-xl">✕</button>
        </div>
        <div class="space-y-4">
          <p id="info-desc" class="text-lg leading-relaxed">物件詳細說明文字。</p>
        </div>
        <div class="mt-6 text-center">
          <button onclick="closeInfo()" class="bg-yellow-700 hover:bg-yellow-800 text-white px-8 py-2 rounded-full font-bold shadow-md transition-colors">了解</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 強制橫向螢幕提示遮罩 ================= -->
  <div id="portrait-warning" class="fixed inset-0 z-[100] bg-black text-white flex-col items-center justify-center p-6 text-center">
    <div class="w-24 h-24 mb-6 animate-pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <path d="M12 18h.01"></path>
        <path d="M4 12c0-3 3-5 5-5" stroke-dasharray="2 4"></path>
        <path d="M20 12c0-3-3-5-5-5" stroke-dasharray="2 4"></path>
        <path d="M17 7l3 3-3 3"></path>
      </svg>
    </div>
    <h2 class="text-2xl font-bold text-yellow-400 mb-2">請旋轉您的手機</h2>
    <p class="text-gray-300 text-lg">本導覽專為橫向螢幕 (Landscape) 設計，<br>請將手機轉為橫向以獲得最佳體驗。</p>
  </div>

  <script>
    function enterVR() {
      resetMedia();
      closeDialog();
      closeInfo();
      
      const scene2d = document.getElementById('scene-2d');
      scene2d.style.opacity = '0';
      scene2d.style.pointerEvents = 'none';

      const vrUI = document.getElementById('vr-ui');
      vrUI.classList.remove('hidden');
      setTimeout(() => {
        vrUI.classList.remove('opacity-0');
      }, 50);
    }

    function exitVR() {
      const scene2d = document.getElementById('scene-2d');
      scene2d.style.opacity = '1';
      scene2d.style.pointerEvents = 'auto';

      const vrUI = document.getElementById('vr-ui');
      vrUI.classList.add('opacity-0');
      setTimeout(() => {
        vrUI.classList.add('hidden');
      }, 500);
    }

    let typingInterval;
    let isSpeaking = false;

    window.showDialog = function(name, text) {
      resetMedia();
      const dialogBox = document.getElementById('dialog-box');
      document.getElementById('dialog-name').textContent = name;
      document.getElementById('dialog-text').innerHTML = ""; 
      
      dialogBox.classList.remove('translate-y-full');
      typeWriterEffect(document.getElementById('dialog-text'), text);
      speakText(text);
    }

    window.closeDialog = function() {
      document.getElementById('dialog-box').classList.add('translate-y-full');
      resetMedia();
    }

    window.showInfo = function(title, desc) {
      resetMedia(); 
      closeDialog(); 
      
      const modal = document.getElementById('info-modal');
      const content = document.getElementById('info-content');
      
      document.getElementById('info-title').textContent = title;
      document.getElementById('info-desc').innerHTML = desc;
      
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    window.closeInfo = function() {
      const modal = document.getElementById('info-modal');
      const content = document.getElementById('info-content');
      
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      modal.classList.remove('opacity-100');
      
      setTimeout(() => {
        modal.classList.add('opacity-0', 'pointer-events-none');
        modal.classList.remove('pointer-events-auto');
      }, 300);
    }

    function typeWriterEffect(element, text) {
      let i = 0;
      clearInterval(typingInterval);
      const plainText = text.replace(/<[^>]*>?/gm, ''); 

      typingInterval = setInterval(() => {
        if (i < plainText.length) {
          element.textContent += plainText.charAt(i);
          i++;
        } else {
          clearInterval(typingInterval);
        }
      }, 50); 
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        const cleanText = text.replace(/<[^>]*>?/gm, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'zh-TW'; 
        utterance.rate = 1.0; 
        
        if (cleanText.includes("沉重的灰石罐")) utterance.pitch = 0.8;
        if (cleanText.includes("個子小")) utterance.pitch = 1.2;
        if (cleanText.includes("未盡款待義務")) utterance.rate = 1.1;

        window.speechSynthesis.speak(utterance);
        isSpeaking = true;
      }
    }

    function resetMedia() {
      clearInterval(typingInterval);
      if (isSpeaking && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
      }
    }

    window.addEventListener('beforeunload', resetMedia);
    document.addEventListener('visibilitychange', () => { if (document.hidden) resetMedia(); });
  </script>
</body>
</html>
