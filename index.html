<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福音場景互動導覽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-padding-top: 1.5rem; }

        body {
            min-height: 100vh;
            background: #140e0a;
            color: #3a2415;
            font-family: "Noto Serif TC", "PingFang TC", "PMingLiU", serif;
            line-height: 1.5;
        }

        .skip {
            position: absolute;
            left: 1rem;
            top: 0;
            transform: translateY(-120%);
            background: #f6edd8;
            color: #3a2415;
            padding: 0.5rem 0.8rem;
            z-index: 5;
        }

        .skip:focus {
            transform: none;
            outline: 2px solid #d4920a;
            outline-offset: 2px;
        }

        .wrap {
            width: min(1120px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 2.5rem 0 3.5rem;
        }

        .masthead {
            max-width: 40rem;
            margin-bottom: 2rem;
        }

        .kicker {
            color: #f6e6c4;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.22em;
        }

        h1 {
            margin-top: 0.45rem;
            color: #f8edd6;
            font-size: clamp(2rem, 4vw, 3.25rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.2;
        }

        .lede {
            margin-top: 0.7rem;
            color: #e7d3ae;
            font-size: 1.05rem;
        }

        .tours {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .tour a {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #f6edd8;
            color: inherit;
            text-decoration: none;
            border: 1px solid rgba(246, 230, 196, 0.28);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .tour a:hover,
        .tour a:focus-visible {
            border-color: #d4920a;
            box-shadow: 0 0 0 2px rgba(212, 146, 10, 0.85);
            outline: none;
        }

        .poster {
            aspect-ratio: 3 / 2;
            width: 100%;
            object-fit: contain;
            background: #efe2c6;
        }

        .copy {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding: 0.9rem 1rem 1rem;
        }

        .ref {
            color: #6b4a2a;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            line-height: 1.35;
        }

        .go {
            margin-top: 0.35rem;
            color: #6b4a2a;
            font-size: 0.85rem;
            font-weight: 700;
        }

        @media (min-width: 700px) {
            .tours { grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        }

        @media (min-width: 1040px) {
            .tours { grid-template-columns: 1fr 1fr 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tour a { transition: none; }
        }
    </style>
</head>
<body>
    <a class="skip" href="#tours">跳至導覽列表</a>
    <div class="wrap">
        <header class="masthead">
            <p class="kicker">福音場景</p>
            <h1>互動導覽</h1>
            <p class="lede">選一張統整表，沿著框線看考古細節與人物台詞。</p>
        </header>
        <main>
            <ul class="tours" id="tours">
                <li class="tour">
                    <a href="Wedding.html">
                        <img class="poster" src="assets/wedding/back.png" alt="">
                        <div class="copy">
                            <p class="ref">約翰福音 2:1-11</p>
                            <h2>迦拿婚宴</h2>
                            <p class="go">進入導覽</p>
                        </div>
                    </a>
                </li>
                <li class="tour">
                    <a href="Sea.html">
                        <img class="poster" src="assets/sea/poster.png" alt="">
                        <div class="copy">
                            <p class="ref">馬可福音 4:35-41</p>
                            <h2>平靜風和海</h2>
                            <p class="go">進入導覽</p>
                        </div>
                    </a>
                </li>
                <li class="tour">
                    <a href="Daughter.html">
                        <img class="poster" src="assets/Daughter/Picture/JesusAndGirl.png" alt="">
                        <div class="copy">
                            <p class="ref">馬可福音 5:21-43</p>
                            <h2>睚魯女兒的神蹟</h2>
                            <p class="go">進入導覽</p>
                        </div>
                    </a>
                </li>
                <li class="tour">
                    <a href="Bleeding.html">
                        <img class="poster" src="assets/Bleeding/poster.jpg" alt="">
                        <div class="copy">
                            <p class="ref">馬可福音 5:25-34</p>
                            <h2>醫治血漏婦人</h2>
                            <p class="go">進入導覽</p>
                        </div>
                    </a>
                </li>
                <li class="tour">
                    <a href="Zacchaeus.html">
                        <img class="poster" src="assets/Zacchaeus/poster.jpg" alt="">
                        <div class="copy">
                            <p class="ref">路加福音 19:1-10</p>
                            <h2>撒該與耶利哥</h2>
                            <p class="go">進入導覽</p>
                        </div>
                    </a>
                </li>
            </ul>
        </main>
    </div>
</body>
</html>
